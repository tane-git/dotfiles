# Guarded because this config is also loaded inside the Inferno opencode
# container, which has bash but no zsh. tmux rejects a default-shell that
# does not exist with "not a suitable shell" on every attach; falling through
# leaves it on the user's login shell, which is what you want there anyway.
if-shell '[ -x /usr/bin/zsh ]' 'set-option -g default-shell /usr/bin/zsh'
set -g mouse on
set -s escape-time 0
set -g focus-events on
setw -g mode-keys vi
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:Tc"
set -as terminal-features ",alacritty:extkeys"
set -s extended-keys always
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Single source of truth for the highlight colour, so everything that marks
# "this is the active thing" can be repainted at once — see the F12
# passthrough binding, which flips it to purple while keys are being handed
# to a nested tmux. Style options expand #{...} the same way formats do
# (verified), so the border and the tab both just follow this.
set -g @accent green

bind-key -n C-Space copy-mode

# Copy mode scrolling
bind-key -T copy-mode-vi C-j send-keys -X halfpage-down
bind-key -T copy-mode-vi C-k send-keys -X halfpage-up

# Window switching with Alt+numbers
bind-key -n M-0 select-window -t 0
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Window navigation
bind-key -n M-H previous-window
bind-key -n M-L if-shell -F '#{==:#{window_index},#{session_windows}}' 'new-window -a -c "#{pane_current_path}"' 'next-window'
bind-key -n M-o last-window
bind-key -n M-t new-window -a -c "#{pane_current_path}"
bind-key -n M-r command-prompt -I "#W" "rename-window '%%'"
bind-key -n M-x kill-pane
bind-key -n M-J swap-window -t -1 \; select-window -t -1
bind-key -n M-K swap-window -t +1 \; select-window -t +1

# Config management
bind-key -n M-c switch-client -T config-mode
bind-key -T config-mode r source-file ~/.tmux.conf \; display-message "Config reloaded!"
bind-key -T config-mode v new-window "v ~/.tmux.conf"
bind-key -T config-mode n run-shell "~/.tmux/toggle-notify.sh"

# Pane selection
bind-key -n M-h if-shell -F '#{pane_at_left}'   'split-window -h -b -c "#{pane_current_path}"' 'select-pane -L'
bind-key -n M-j if-shell -F '#{pane_at_bottom}' 'split-window -v    -c "#{pane_current_path}"' 'select-pane -D'
bind-key -n M-k if-shell -F '#{pane_at_top}'    'split-window -v -b -c "#{pane_current_path}"' 'select-pane -U'
bind-key -n M-l if-shell -F '#{pane_at_right}'  'split-window -h    -c "#{pane_current_path}"' 'select-pane -R'

# Pane resize
bind-key -n M-Left  resize-pane -L 5
bind-key -n M-Down  resize-pane -D 5
bind-key -n M-Up    resize-pane -U 5
bind-key -n M-Right resize-pane -R 5

# Pane zoom
bind-key -n M-z resize-pane -Z

# Pane equalize
bind-key -n M-e select-layout -E

# Pane break
bind-key -n M-b break-pane -d -a
bind-key -n M-B break-pane -a

# Pane marking
bind-key -n M-m select-pane -m

# Pane paste (join the marked pane onto this one)
bind-key -n M-v switch-client -T PASTE
bind-key -T PASTE h join-pane -h -b -s '{marked}' \; switch-client -T root
bind-key -T PASTE l join-pane -h    -s '{marked}' \; switch-client -T root
bind-key -T PASTE k join-pane -v -b -s '{marked}' \; switch-client -T root
bind-key -T PASTE j join-pane -v    -s '{marked}' \; switch-client -T root
bind-key -T PASTE Escape switch-client -T root

# Pane mode
bind-key -n M-p switch-client -T PANES
bind-key -T PANES h split-window -h -b -c "#{pane_current_path}" \; switch-client -T root
bind-key -T PANES l split-window -h    -c "#{pane_current_path}" \; switch-client -T root
bind-key -T PANES k split-window -v -b -c "#{pane_current_path}" \; switch-client -T root
bind-key -T PANES j split-window -v    -c "#{pane_current_path}" \; switch-client -T root
bind-key -T PANES e select-layout -E \; switch-client -T root
bind-key -T PANES o rotate-window \; switch-client -T root
bind-key -T PANES c select-layout even-horizontal \; switch-client -T root
bind-key -T PANES r select-layout even-vertical \; switch-client -T root
bind-key -T PANES Escape switch-client -T root

# Session management
# -f hides dashboard clone sessions (tagged @agent-dashboard-clone, must
# match $CLONE_OPTION in agent-lib.sh) from the picker. -F is tmux 3.6a's
# own default tree-line format (from window-tree.c) with the
# "#{?session_grouped, (group ...),}" clause removed, so real sessions
# don't show group noise while a dashboard clone is grouped with them.
bind-key -n M-s choose-tree -Zs -O name -f "#{==:#{@agent-dashboard-clone},}" -F '#{?pane_format,#{?pane_marked,#[reverse],}#{pane_current_command}#{?pane_active,*,}#{?pane_marked,M,}#{?#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}},: "#{pane_title}",},#{?window_format,#{?window_marked_flag,#[reverse],}#{window_name}#{window_flags}#{?#{&&:#{==:#{window_panes},1},#{&&:#{pane_title},#{!=:#{pane_title},#{host_short}}}},: "#{pane_title}",},#{session_windows} windows#{?session_attached, (attached),}}}'
bind-key -n M-C new-session
bind-key -n M-R command-prompt -p "rename session:" "rename-session '%%'"

# Agent dashboard
bind-key -n M-d run-shell "~/.tmux/agent-dashboard.sh '#{client_tty}'"
bind-key -n M-g run-shell "~/.tmux/agent-goto-session.sh '#{client_tty}'"

# opencode session console — M-s picks a tmux session, M-S picks an opencode
# one (from the server, whether or not it has a tmux view yet) and opens a
# view onto it.
#
# display-popup rather than display-menu: the picker is fzf, which needs a
# real tty to draw into, and a menu can neither scroll nor filter as you
# type. -E closes the popup when the script exits. #{client_tty} is passed
# through because switch-client's guess at "the current client" is exactly
# the guess a popup breaks — see oc-open.sh.
#
# Wrapped in run-shell purely to get that format expanded: display-popup does
# NOT expand #{...} in its shell-command argument (verified — the script
# received the literal string "#{client_tty}", so switch-client was handed a
# nonexistent client and silently did nothing). run-shell does expand it, and
# -c pins the popup to the same client now that -b means we are detached from
# the one that pressed the key.
#
# -B drops the popup's own border because fzf draws one of its own, and that
# is the one carrying the active-filter label. Two nested frames just eat two
# columns and read as noise.
bind-key -n M-S run-shell -b "tmux display-popup -E -B -w 90% -h 80% -c '#{client_tty}' '~/.tmux/oc-pick.sh --client=#{client_tty}'"

# Tear down the dashboard the instant anyone leaves it, however they leave
# (M-g, M-s, anything) — see agent-dashboard-hook.sh for why.
set-hook -g client-session-changed 'run-shell "~/.tmux/agent-dashboard-hook.sh \"#{hook_client}\" \"#{session_name}\""'

# Track which dashboard tile is focused so clone status bars can highlight
# themselves — see agent-dashboard-focus-hook.sh.
set-hook -g pane-focus-in 'run-shell "~/.tmux/agent-dashboard-focus-hook.sh \"#{session_name}\" \"#{hook_pane}\""'

# Toggle windows <-> panes
bind-key -n M-a run-shell "~/.tmux/toggle-panes.sh"

# Smart toggle between windows and panes
bind-key -n M-A run-shell " \
    if [ $(tmux list-windows | wc -l) -gt 1 ]; then \
        while tmux join-pane -s :+ 2>/dev/null; do :; done && tmux select-layout tiled; \
    elif [ $(tmux list-panes | wc -l) -gt 1 ]; then \
        while [ $(tmux list-panes | wc -l) -gt 1 ]; do tmux break-pane -d -a; done; \
    fi \
"

# --- Status Bar General ---
# Bar background stays transparent (matches the terminal), so tabs read
# as plain text with no "pill" behind them.
set -g status-position top
set -g status-style bg=default,fg=default
set -g status-left-length 100
set -g status-left " #[bold]#S#[nobold] "
set -g status-right ""
set -g status-interval 1

# --- Inactive Tab Styling ---
setw -g window-status-style fg=default
setw -g window-status-format " #W#{?#{==:#{@agent-state},busy},#[bold] #(~/.tmux/spinner.sh)#[nobold],#{?#{==:#{@agent-state},input},#[fg=colour0]#[bold] ?#[fg=default]#[nobold],#{?#{==:#{@agent-state},error},#[fg=colour0]#[bold] ✗#[fg=default]#[nobold],#{?#{==:#{@agent-state},done},#[fg=colour0]#[bold] ✔#[fg=default]#[nobold],}}}} "

# --- Active Tab Styling ---
# 'colour0' forces deep black text on the green highlight.
# Quoted: an unquoted "#{" in a config file starts a comment, which truncates
# the value and aborts the rest of the file with a syntax error.
setw -g window-status-current-style "bg=#{@accent},fg=colour0,bold"
setw -g window-status-current-format "#[fg=colour0,bg=#{@accent},bold] #W#{?#{==:#{@agent-state},busy},#[fg=colour0]#[bold] #(~/.tmux/spinner.sh)#[nobold],#{?#{==:#{@agent-state},input},#[fg=colour0]#[bold] ?#[fg=colour0]#[nobold],#{?#{==:#{@agent-state},error},#[fg=colour0]#[bold] ✗#[fg=colour0]#[nobold],#{?#{==:#{@agent-state},done},#[fg=colour0]#[bold] ✔#[fg=colour0]#[nobold],}}}} "

setw -g window-status-separator "#[fg=colour240]|"

# --- Pane Border ---
# pane-border-status draws a thin real border line at the top of each
# pane; with only one pane per window this reads as the "line between the
# status bar and the pane content" look. pane-border-indicators defaults
# to "colour", which deliberately colours only half the shared divider
# between two panes (see screen-redraw.c) - "off" keeps the whole divider
# in one colour matching whichever pane is active.
set -g pane-border-status top
set -g pane-border-format ""
set -g pane-border-lines single
set -g pane-border-indicators off
set -g pane-border-style fg=colour238,bg=default
set -g pane-active-border-style "fg=#{@accent},bg=default"

# --- Passthrough mode (nested tmux) ---
# Every binding in this file is -n, i.e. root-table with no prefix, so a tmux
# running inside a pane (the one in the Inferno opencode pod, reached over
# ssh) never sees M-h, M-s, M-d and the rest — this server swallows them
# first. F12 parks this server on an empty key table and unsets its prefix,
# so keystrokes fall straight through to the inner tmux; F12 again restores
# both. The one key still bound while parked is F12 itself, in the "off"
# table, which is what makes the mode escapable.
#
# The accent flip to purple is not decoration — with two identical-looking
# tmux servers stacked, it is the only way to tell which one is listening.
# refresh-client -S forces the status line to repaint immediately rather
# than waiting for the next status-interval tick.
# F10/F11 set the accent to an explicit state rather than toggling it. They
# are what an *outer* tmux sends into this one (see the send-keys below) to
# say "you have the keys now" / "you do not". Explicit states rather than a
# toggle means the two servers can never drift out of sync, however many
# times you bounce between them.
#
# These reach a nested tmux because send-keys writes straight to the pane's
# pty: the inner tmux client reads it as a genuine keypress and its own -n
# bindings intercept it before whatever is running inside. Verified against
# two real stacked servers.
bind-key -n F10 set -g @accent green
bind-key -n F11 set -g @accent colour141

# Entering passthrough: this server goes purple and stops listening, and the
# nested tmux is told to go green because it is now the one receiving keys.
# Leaving does the reverse. The if-shell guard means the keystroke is only
# ever injected into a pane the `inferno` shell function marked as holding a
# nested session — without it, F12 pressed anywhere else would fire a stray
# F10/F11 into whatever happened to be running there.
bind-key -n F12 \
  set -g @accent colour141 \; \
  set -g prefix None \; \
  set -g key-table off \; \
  if-shell -F '#{@nested}' 'send-keys F10' \; \
  refresh-client -S

bind-key -T off F12 \
  set -g @accent green \; \
  set -gu prefix \; \
  set -gu key-table \; \
  if-shell -F '#{@nested}' 'send-keys F11' \; \
  refresh-client -S

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -in"

